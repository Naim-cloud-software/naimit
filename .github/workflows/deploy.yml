name: Deploy to Firebase
on: {push: {branches: [main]}, workflow_dispatch: {}}
jobs: {deploy: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: w9jds/firebase-action@master, with: {args: "deploy --only hosting,firestore:rules --project naimit-ncs"}, env: {GCP_SA_KEY: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"}}]}}
