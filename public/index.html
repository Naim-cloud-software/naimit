<!DOCTYPE html>
<html lang="nl">
<head>

<title>Naimit - Quiz, hack en win</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<style>
:root{--bg:#0a0c10;--s1:#11141b;--s2:#171b24;--s3:#1e2330;--line:#252b3a;--tx:#e8ebf2;--mut:#8a92a6;--ac:#3ddc97;--ac-d:#0f3d2b;--blue:#5b8cff;--bad:#ff5d6c;--warn:#f5b84b;--r:14px;--sp:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--tx);font:400 16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
background-image:radial-gradient(1200px 500px at 70% -10%,rgba(91,140,255,.10),transparent 60%),radial-gradient(900px 400px at 0% 0%,rgba(61,220,151,.07),transparent 55%)}
h1,h2,h3,p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--ac);text-decoration:none}
.mono{font-family:'JetBrains Mono',monospace}
[hidden]{display:none!important}
*{scrollbar-width:thin;scrollbar-color:#2a3144 transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a3144;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
svg.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header */
#hdr{position:sticky;top:0;z-index:30;background:rgba(10,12,16,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hin{max-width:1120px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.hr{display:flex;align-items:center;gap:8px}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--mut);border:1px solid transparent}
.ib:hover{background:var(--s2);color:var(--tx)}
/* layout */
main{min-height:calc(100dvh - 60px)}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
.narrow{max-width:720px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card.hl{border-color:rgba(61,220,151,.35);box-shadow:0 0 0 4px rgba(61,220,151,.05)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.between{justify-content:space-between}
.mt{margin-top:16px}.mt2{margin-top:28px}
.mut{color:var(--mut)}.sm{font-size:.875rem}.xs{font-size:.75rem}
.lbl{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:8px;display:block}
/* controls */
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;outline:none;transition:border .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(61,220,151,.15)}
input::placeholder,textarea::placeholder{color:#566079}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac);padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:600;background:var(--s2);border:1px solid var(--line);transition:.15s;min-height:46px}
.btn:hover{background:var(--s3);border-color:#323a4f}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ac);color:#04140d;border-color:var(--ac)}
.btn.pri:hover{background:#52e6a7}
.btn.dng{color:var(--bad);border-color:rgba(255,93,108,.3)}
.btn.ghost{background:none}
.btn.blk{width:100%}
.btn.lg{min-height:54px;font-size:1.05rem}
.btn.s{min-height:36px;padding:7px 12px;font-size:.875rem;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:8px 14px;border-radius:9px;font-weight:600;color:var(--mut);min-height:38px}
.seg button.on{background:var(--s3);color:var(--tx)}
.err{color:var(--bad);font-size:.875rem;min-height:1.3em;margin-top:8px}
/* home */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:56px 0 40px}
.hero h1{font-size:clamp(2.4rem,6vw,4.1rem);line-height:1.04;font-weight:800;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--ac)}
.hero p.lead{font-size:1.15rem;color:var(--mut);margin-top:18px;max-width:520px}
.pin-in{text-align:center;font-family:'JetBrains Mono',monospace;font-size:2rem;font-weight:700;letter-spacing:.35em;padding:16px 10px 16px 24px}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.feat .card{padding:20px}
.feat .ic{width:40px;height:40px;border-radius:10px;background:var(--ac-d);color:var(--ac);display:grid;place-items:center;margin-bottom:12px}
.feat h3{font-size:1rem;margin-bottom:4px}
.feat p{color:var(--mut);font-size:.9rem}
footer.f{border-top:1px solid var(--line);padding:22px 20px;text-align:center;color:var(--mut);font-size:.8rem;margin-top:30px}
/* avatars / lists */
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:700;font-size:.8rem;color:#0a0c10;flex:none}
.av.l{width:44px;height:44px;font-size:1.1rem}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:#fff}
.chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line);animation:in .3s;min-width:0}
.chip span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chip .x{margin-left:auto;color:var(--mut);padding:4px;border-radius:6px}.chip .x:hover{color:var(--bad)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pgrid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.pin-big{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(3.4rem,15vw,7rem);letter-spacing:.08em;line-height:1;color:var(--tx)}
.qr{width:148px;height:148px;border-radius:12px;background:#fff;padding:8px}
/* setup */
.setup{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
.sticky{position:sticky;top:76px}
.qrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line);margin-bottom:8px}
.qrow .x{color:var(--mut);padding:6px;border-radius:8px}.qrow .x:hover{color:var(--bad);background:var(--s3)}
.pill{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:99px;background:var(--s3);font-size:.8rem;font-weight:600}
/* game */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{display:block;font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.stat b{font-family:'JetBrains Mono',monospace;font-size:1.5rem}
.bar{height:6px;border-radius:99px;background:var(--s3);overflow:hidden;margin:14px 0}
.bar>div{height:100%;background:var(--ac);transition:width .4s;border-radius:99px}
.qcard{padding:34px 24px;text-align:center;font-size:clamp(1.25rem,3.6vw,1.9rem);font-weight:700;line-height:1.3;letter-spacing:-.01em;margin:6px 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:18px;border-radius:14px;background:var(--s1);border:1.5px solid var(--line);font-weight:600;font-size:1.02rem;min-height:68px;transition:.12s}
.opt:hover{border-color:#3a4260;background:var(--s2)}
.opt i{font-style:normal;font-family:'JetBrains Mono',monospace;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:.85rem;flex:none;color:#0a0c10;font-weight:700}
.o0 i{background:#ff7a8a}.o1 i{background:#7aa2ff}.o2 i{background:#f5b84b}.o3 i{background:#3ddc97}
.opt.ok{border-color:var(--ac);background:var(--ac-d)}
.opt.bad{border-color:var(--bad);background:rgba(255,93,108,.1);animation:sh .3s}
.opt.dim{opacity:.4}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fx{display:flex;gap:8px;flex-wrap:wrap;min-height:30px;margin:12px 0 0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.tag.sh{color:var(--blue);border-color:rgba(91,140,255,.4)}.tag.ml{color:var(--warn);border-color:rgba(245,184,75,.4)}.tag.ok{color:var(--ac);border-color:rgba(61,220,151,.4)}
.lb{display:grid;gap:6px}
.lbrow{display:grid;grid-template-columns:28px 34px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--s2);border:1px solid transparent;width:100%;text-align:left}
.lbrow.me{border-color:rgba(61,220,151,.5);background:var(--ac-d)}
.lbrow .rk{font-family:'JetBrains Mono',monospace;color:var(--mut);font-weight:700;font-size:.85rem}
.lbrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:8px;align-items:center}
.lbrow .sc{font-family:'JetBrains Mono',monospace;font-weight:700}
button.lbrow:hover{border-color:var(--bad)}
.timer{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:2.4rem;line-height:1}
.timer.low{color:var(--bad)}
.feed{display:grid;gap:6px;font-size:.9rem}
.feed div{padding:9px 12px;border-radius:10px;background:var(--s2);border-left:3px solid var(--bad);animation:in .3s}
/* overlays */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,7,10,.78);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.box{width:100%;max-width:520px;max-height:92dvh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:24px;animation:in .25s}
.box.w{max-width:660px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.hcard{text-align:left;padding:16px;border-radius:14px;background:var(--s2);border:1px solid var(--line);transition:.15s}
.hcard:hover{border-color:var(--c);transform:translateY(-2px)}
.hcard .hi{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);margin-bottom:10px}
.hcard b{display:block;margin-bottom:3px}.hcard span{font-size:.82rem;color:var(--mut)}
.block{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:rgba(10,12,16,.92);backdrop-filter:blur(10px)}
.block .big{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line)}
.block .big svg{width:34px;height:34px}
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:80;padding:12px 18px;border-radius:12px;font-weight:600;font-size:.95rem;animation:in .25s;max-width:92vw;text-align:center;background:var(--s3);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.good{border-color:rgba(61,220,151,.5)}.toast.bad{border-color:rgba(255,93,108,.5)}
.spin{width:34px;height:34px;border:3px solid var(--s3);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}@keyframes sp{to{transform:rotate(360deg)}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:26px 0;min-height:240px}
.pod{width:min(30%,170px);border-radius:14px 14px 0 0;padding:14px 8px;text-align:center;animation:rise .8s both;display:flex;flex-direction:column;align-items:center;gap:6px}
.pod .n{font-weight:700;word-break:break-word}.pod .s{font-family:'JetBrains Mono',monospace;font-size:.9rem;color:var(--tx)}
.pod .pl{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:1.5rem}
.p1{height:230px;background:linear-gradient(#3b3216,#1c180a);border:1px solid rgba(245,184,75,.4);animation-delay:.6s}.p1 .pl{color:var(--warn)}
.p2{height:180px;background:linear-gradient(#262b38,#161a23);border:1px solid var(--line);animation-delay:.3s}
.p3{height:140px;background:linear-gradient(#35251a,#1a120c);border:1px solid rgba(205,127,50,.35);animation-delay:0s}
@keyframes rise{from{transform:translateY(160px);opacity:0}to{transform:none;opacity:1}}
.award{padding:14px 16px;border-radius:12px;background:var(--s1);border:1px solid var(--line)}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border-radius:9px;font-weight:600;color:var(--mut)}.tabs button.on{background:var(--s3);color:var(--tx)}
.divider{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:.8rem;margin:16px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{background:#fff;color:#1f1f1f;border-color:#fff;gap:10px}.gbtn:hover{background:#f1f3f4}
.gbtn svg{width:20px;height:20px}
.sbar{display:none}
/* mobile */
@media(max-width:860px){
 .hero{grid-template-columns:1fr;gap:28px;padding:28px 0 18px}
 .feat{grid-template-columns:1fr}
 .setup{grid-template-columns:1fr}.sticky{position:static}
}
@media(max-width:600px){
 .wrap{padding:18px 14px 40px}.hin{padding:0 14px}
 .opts{grid-template-columns:1fr}
 .opt{min-height:62px;padding:15px}
 .stats{gap:8px}.stat{padding:10px}.stat b{font-size:1.2rem}
 .qcard{padding:24px 16px}
 .box{padding:20px;border-radius:16px}
 .modal{align-items:flex-end;padding:0}.box{border-bottom-left-radius:0;border-bottom-right-radius:0;max-height:94dvh;padding-bottom:calc(20px + var(--sp))}
 .pin-in{font-size:1.7rem;letter-spacing:.28em}
 .hide-m{display:none}
 .sbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px 14px calc(12px + var(--sp));background:rgba(10,12,16,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
 .has-sbar{padding-bottom:96px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function Board(players, meId, max = 10) {
  const now = Date.now();

    <span class="nm">${esc(p.name)}${p.shield ? `<span style="color:var(--blue)">${ic("shield")}</span>` : ""}${p.frozenUntil > now ? `<span style="color:#5fd6e6">${ic("snow")}</span>` : ""}${p.multUntil > now ? `<span style="color:var(--warn)">${ic("zap")}</span>` : ""}</span>
    <span class="sc">${fmt(p.score)}</span></div>`).join("");
}
const mapP = s => s.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => !p.kicked);

  }));

function onMe(prev) {
  if (S.view !== "pgame" || !S.me) return; const me = S.me;
  if (prev && me.lastHit && (!prev.lastHit || prev.lastHit.at !== me.lastHit.at)) {
    if (me.lastHit.blocked) { toast("Je Firewall blokkeerde een hack van " + me.lastHit.by, "good"); sfx.ok(); }
    else { toast(`${me.lastHit.by} gebruikte ${HACKS[me.lastHit.kind].n} op jou` + (me.lastHit.amt ? ` (-${fmt(me.lastHit.amt)})` : ""), "bad", 3500); sfx.hit(); }
  }
  paint();
}

let G = null;
function PlayerGame() {
  G = { order: shuffle(S.game.questions.map((_, i) => i)), pos: 0, locked: false, picking: false, cur: null };
  go("pgame", `<div class="wrap narrow" style="padding-top:18px">
    <div class="stats"><div class="stat"><small>Credits</small><b id="sc" style="color:var(--warn)">0</b></div><div class="stat"><small>Streak</small><b id="stk">0</b></div><div class="stat"><small>Tijd</small><b id="tm" style="color:var(--ac)">0:00</b></div></div>
    <div class="bar" title="Voortgang naar je volgende hack"><div id="prog" style="width:0"></div></div>
    <div class="fx" id="fx" style="margin:0 0 4px"></div>
    <div class="card qcard" id="qc"></div><div class="opts" id="opts"></div>
    <div class="card mt2"><label class="lbl">Top 5</label><div class="lb" id="lb"></div></div></div><div id="layer"></div>`);
  nextQ();
  if (!localStorage.seenTip) { localStorage.seenTip = 1; setTimeout(() => toast("Tip: na een paar goede antwoorden mag je een hack kiezen", "good", 4500), 600); }
  S.tick = setInterval(() => {
    const left = S.game.endsAt - Date.now(); $("#tm") && ($("#tm").textContent = fmtT(left)); paint();
    if (left <= -4000 && S.view !== "podium") Podium(S.pin);
  }, 250);
  paint();
}

function nextQ() {
  if (S.view !== "pgame") return;
  const qs = S.game.questions;
  if (G.pos >= G.order.length) { G.order = shuffle(G.order); G.pos = 0; }
  const q = qs[G.order[G.pos++]];
  let opts = shuffle([q.a, ...q.options]).slice(0, 4); if (!opts.includes(q.a)) opts[0] = q.a;
  G.cur = { q, opts: shuffle(opts) }; G.locked = false; G.shownAt = Date.now();
  $("#qc").textContent = q.q;
  $("#opts").innerHTML = G.cur.opts.map((o, i) => `<button class="opt o${i}" data-i="${i}"><i>${LET[i]}</i><span>${esc(o)}</span></button>`).join("");
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i, b));
}

async function answer(i, btn) {
  const me = S.me; if (G.locked || G.picking || !me || me.frozenUntil > Date.now() || S.game.endsAt < Date.now()) return;
  G.locked = true; const ok = G.cur.opts[i] === G.cur.q.a; const every = S.game.every || 3;
  if (ok) {
    btn.classList.add("ok"); sfx.ok();
    const mult = me.multUntil > Date.now() ? 2 : 1, fast = Date.now() - G.shownAt < 3000 ? 1.5 : 1;
    const pts = Math.round((100 + Math.min(me.streak, 10) * 15) * mult * fast), correct = (me.correct || 0) + 1;
    await updateDoc(pref(S.pin, pid), { score: increment(pts), streak: increment(1), correct: increment(1), best: Math.max(me.best || 0, me.streak + 1) });
    toast(`+${pts} credits${fast > 1 ? " (snelheidsbonus)" : ""}`, "good", 900);
    if (S.game.hacks && correct % every === 0) return setTimeout(offerHacks, 450);
    setTimeout(nextQ, 450);
  } else {
    btn.classList.add("bad"); sfx.bad();
    document.querySelectorAll(".opt").forEach(b => { if (G.cur.opts[+b.dataset.i] === G.cur.q.a) b.classList.add("ok"); else if (b !== btn) b.classList.add("dim"); });
    await updateDoc(pref(S.pin, pid), { streak: 0, wrong: increment(1) });
    setTimeout(nextQ, 1500);
  }
}

function paint() {
  const me = S.me; if (!me || S.view !== "pgame" || !$("#sc")) return; const now = Date.now(), every = S.game.every || 3;
  $("#sc").textContent = fmt(me.score); $("#stk").textContent = me.streak;
  $("#prog").style.width = S.game.hacks ? ((me.correct || 0) % every) / every * 100 + "%" : "0";
  $("#fx").innerHTML = (me.shield ? `<span class="tag sh">${ic("shield")} Firewall actief</span>` : "") + (me.multUntil > now ? `<span class="tag ml">${ic("zap")} x2 nog ${Math.ceil((me.multUntil - now) / 1000)}s</span>` : "")
    + `<span class="tag">${S.game.hacks ? `Nog ${every - ((me.correct || 0) % every)} goed voor een hack` : "Hacks staan uit"}</span>`;
  $("#lb").innerHTML = Board(S.players, pid, 5);
  const bo = S.game.blackout, lay = $("#layer");
  if (bo && bo.until > now && bo.by !== pid && !G.picking) { lay.innerHTML = `<div class="block" style="background:#000"><div class="big">${ic("moon")}</div><h2>Blackout</h2><p class="mut">${esc(bo.name)} heeft het licht uitgedaan</p><div class="timer">${Math.ceil((bo.until - now) / 1000)}</div></div>`; return; }
  if (me.frozenUntil > now && !G.picking) lay.innerHTML = `<div class="block"><div class="big" style="color:#5fd6e6">${ic("snow")}</div><h2>Je bent bevroren</h2><p class="mut">Je kunt zo weer antwoorden</p><div class="timer">${Math.ceil((me.frozenUntil - now) / 1000)}</div></div>`;
  else if (lay.firstChild && lay.firstChild.classList.contains("block")) lay.innerHTML = "";
}

function offerHacks() {
  G.picking = true; sfx.hack();
  const hand = shuffle(HKEYS).slice(0, 3);
  $("#layer").innerHTML = `<div class="modal"><div class="box w"><span class="lbl" style="color:var(--ac)">Toegang verleend</span><h2 style="font-size:1.4rem">Kies je hack</h2>
    <div class="cards">${hand.map(k => `<button class="hcard" style="--c:${HACKS[k].c}" data-k="${k}"><div class="hi">${ic(HACKS[k].ic)}</div><b>${HACKS[k].n}</b><span>${HACKS[k].d}</span></button>`).join("")}</div></div></div>`;
  document.querySelectorAll(".hcard").forEach(b => b.onclick = () => pickHack(b.dataset.k));
}
function pickHack(k) {
  const H = HACKS[k]; if (!H.t) return runHack(k, null);
  const targets = S.players.filter(p => p.id !== pid).sort((a, b) => b.score - a.score).slice(0, 12);
  if (!targets.length) { toast("Er zijn geen doelwitten online", "bad"); return endPick(); }
  $("#layer").innerHTML = `<div class="modal"><div class="box w"><div class="row" style="color:${H.c}">${ic(H.ic)}<b>${H.n}</b></div><h2 style="font-size:1.3rem;margin-top:4px">Kies een doelwit</h2>
    <div class="lb mt">${targets.map(p => `<button class="lbrow" data-t="${p.id}"><span class="rk"></span>${avatar(p)}<span class="nm">${esc(p.name)}${p.shield ? `<span style="color:var(--blue)">${ic("shield")}</span>` : ""}</span><span class="sc">${fmt(p.score)}</span></button>`).join("")}</div>
    <button class="btn blk mt" id="skip">Annuleren</button></div></div>`;
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => runHack(k, b.dataset.t));
  $("#skip").onclick = offerHacks;
}
function endPick() { G.picking = false; $("#layer").innerHTML = ""; nextQ(); }

async function runHack(k, tid) {
  const H = HACKS[k], me = S.me; let text = "";
  try {
    if (k === "overclock") { await updateDoc(pref(S.pin, pid), { multUntil: Date.now() + 20000 }); text = `${me.name} activeerde Overclock`; }
    else if (k === "firewall") { await updateDoc(pref(S.pin, pid), { shield: true }); text = `${me.name} zette een Firewall op`; }
    else if (k === "jackpot") { await updateDoc(pref(S.pin, pid), { score: increment(250) }); text = `${me.name} won de Jackpot (+250)`; }
    else if (k === "blackout") { await updateDoc(gref(S.pin), { blackout: { by: pid, name: me.name, until: Date.now() + 5000 } }); text = `${me.name} activeerde Blackout`; }
    else {
      const res = await runTransaction(db, async tx => {
        const tr = pref(S.pin, tid), mr = pref(S.pin, pid);
        const [ts, ms] = await Promise.all([tx.get(tr), tx.get(mr)]); const t = ts.data(), m = ms.data(), at = Date.now();
        if (t.shield) { tx.update(tr, { shield: false, lastHit: { by: m.name, kind: k, blocked: true, at } }); return { blocked: true, name: t.name }; }
        if (k === "swap") { if (m.score >= t.score) return { nope: true, name: t.name }; tx.update(tr, { score: m.score, lastHit: { by: m.name, kind: k, amt: t.score - m.score, at } }); tx.update(mr, { score: t.score }); return { amt: t.score - m.score, name: t.name }; }
        if (k === "steal") { const amt = Math.floor(t.score * .15); tx.update(tr, { score: t.score - amt, lastHit: { by: m.name, kind: k, amt, at } }); tx.update(mr, { score: m.score + amt }); return { amt, name: t.name }; }
        if (k === "virus") { const amt = Math.min(150, t.score); tx.update(tr, { score: t.score - amt, lastHit: { by: m.name, kind: k, amt, at } }); return { amt, name: t.name }; }
        tx.update(tr, { frozenUntil: at + 6000, lastHit: { by: m.name, kind: k, at } }); return { name: t.name };
      });
      if (res.nope) { text = `${me.name} probeerde te swappen met ${res.name}`; toast("Swap mislukt: je hebt al meer credits", "bad"); }
      else if (res.blocked) { text = `${me.name} faalde: ${res.name} had een Firewall`; toast("Geblokkeerd door een Firewall", "bad"); }
      else { text = `${me.name} gebruikte ${H.n} op ${res.name}` + (res.amt ? ` (${res.amt})` : ""); toast(`${H.n} geslaagd${res.amt ? ": " + fmt(res.amt) + " credits" : ""}`, "good"); }
    }
    sfx.hack(); updateDoc(pref(S.pin, pid), { hacks: increment(1) }); addDoc(ecol(S.pin), { t: Date.now(), text });
  } catch (e) { toast("Hack mislukt. Probeer het opnieuw.", "bad"); }
  endPick();
}

/* ---------- PODIUM ---------- */
function Podium(pin) {
  cleanup(); S.role = S.role || "player"; const wasHost = S.role === "host"; localStorage.removeItem("active");
  go("podium", `<div class="wrap narrow"><div style="text-align:center;padding-top:10px"><span class="lbl" style="color:var(--ac)">Spel afgelopen</span><h1 style="font-size:2.2rem;letter-spacing:-.03em">Eindstand</h1></div>
    <div class="podium" id="pod"></div><div class="grid" id="aw" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:14px"></div>
    <div class="card"><div class="lb" id="lb"></div></div>
    <button class="btn pri blk lg mt2" id="home">Terug naar start</button></div>`);
  $("#home").onclick = () => { S.role = null; Home(""); };
  S.unsubs.push(onSnapshot(pcol(pin), s => {
    const ps = mapP(s).sort((a, b) => b.score - a.score);
    const medal = ["p1", "p2", "p3"];
    $("#pod") && ($("#pod").innerHTML = [[1, "p2"], [0, "p1"], [2, "p3"]].filter(([i]) => ps[i]).map(([i, c]) => `<div class="pod ${c}"><span class="pl">${i + 1}</span>${avatar(ps[i], true)}<div class="n">${esc(ps[i].name)}</div><div class="s">${fmt(ps[i].score)}</div></div>`).join(""));
    const acc = p => (p.correct || 0) + (p.wrong || 0) >= 3 ? (p.correct || 0) / ((p.correct || 0) + (p.wrong || 0)) : 0;
    const best = (fn, min) => ps.filter(p => fn(p) >= min).sort((a, b) => fn(b) - fn(a))[0];
    const aw = [["Scherpschutter", best(acc, .01), p => Math.round(acc(p) * 100) + "% goed"], ["Streak-koning", best(p => p.best || 0, 2), p => p.best + " op rij"], ["Hack-meester", best(p => p.hacks || 0, 1), p => p.hacks + " hacks"], ["Meeste antwoorden", best(p => (p.correct || 0) + (p.wrong || 0), 1), p => ((p.correct || 0) + (p.wrong || 0)) + " vragen"]].filter(a => a[1]);
    $("#aw") && ($("#aw").innerHTML = aw.map(([t, p, f]) => `<div class="award"><span class="lbl" style="margin-bottom:6px">${t}</span><div class="row" style="flex-wrap:nowrap">${avatar(p)}<b>${esc(p.name)}</b><span class="mut sm">${f(p)}</span></div></div>`).join(""));
    $("#lb") && ($("#lb").innerHTML = Board(ps, pid, 50));
    // account stats, once per game
    const myi = ps.findIndex(p => p.id === pid);
    if (user && !wasHost && myi >= 0 && !localStorage["st_" + pin]) {
      localStorage["st_" + pin] = 1; const p = ps[myi];
      setDoc(doc(db, "users", user.uid), { name: dname(), games: increment(1), wins: increment(myi === 0 ? 1 : 0), correct: increment(p.correct || 0), wrong: increment(p.wrong || 0), credits: increment(p.score || 0), updatedAt: Date.now() }, { merge: true }).catch(() => {});
    }
  }));
}

header();
Home();
